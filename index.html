<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitKuchařka PRO - Kompletní Verze</title>
    <style>
        :root { --primary: #3498db; --success: #2ecc71; --danger: #e74c3c; --bg: #f4f7f6; --text: #2c3e50; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; padding-bottom: 90px; color: var(--text); }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Navigace dní */
        .days-nav { display: flex; justify-content: space-between; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; gap: 5px; }
        .day-tab { padding: 8px 12px; border-radius: 10px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 0.8rem; flex-shrink: 0; }
        .day-tab.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Statistiky */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #e3f2fd; padding: 12px; border-radius: 15px; margin-bottom: 15px; }
        .stat-box { text-align: center; font-size: 0.75rem; }
        .stat-box b { display: block; font-size: 1rem; color: var(--primary); }

        /* Formulář a hledání */
        .form-card { background: white; border: 2px solid var(--success); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: none; }
        .autocomplete-wrapper { position: relative; }
        #suggestions { 
            position: absolute; top: 100%; left: 0; right: 0; 
            background: white; border: 1px solid #ddd; border-radius: 0 0 10px 10px; 
            max-height: 250px; overflow-y: auto; z-index: 1001; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: none;
        }
        .suggestion-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .suggestion-item img { width: 35px; height: 35px; border-radius: 4px; object-fit: cover; }

        /* Fotoaparát */
        .photo-area { width: 100%; height: 120px; background: #f9f9f9; border: 2px dashed #ccc; border-radius: 10px; margin-top: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
        .photo-area img { width: 100%; height: 100%; object-fit: cover; }

        /* Vstupy */
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; margin-top: 8px; font-size: 1rem; }
        
        /* Seznam jídel */
        .meal-section { margin-top: 15px; border: 1px solid #eee; border-radius: 12px; overflow: hidden; background: white; }
        .meal-header { background: #f8f9fa; padding: 10px 15px; font-weight: bold; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; }
        .log-item { padding: 10px; border-bottom: 1px solid #f9f9f9; display: flex; align-items: center; gap: 10px; position: relative; }
        .log-item img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; background: #eee; }
        .del-btn { margin-left: auto; background: none; border: none; color: var(--danger); font-size: 1.2rem; cursor: pointer; }

        .fab { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--success); color: white; border: none; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍎 Moje FitKuchařka</h1>

    <div class="days-nav">
        <div class="day-tab" onclick="changeDay(0)">Po</div>
        <div class="day-tab" onclick="changeDay(1)">Út</div>
        <div class="day-tab" onclick="changeDay(2)">St</div>
        <div class="day-tab" onclick="changeDay(3)">Čt</div>
        <div class="day-tab" onclick="changeDay(4)">Pá</div>
        <div class="day-tab" onclick="changeDay(5)">So</div>
        <div class="day-tab" onclick="changeDay(6)">Ne</div>
    </div>

    <div class="stats-grid">
        <div class="stat-box">Kcal<b id="total-kcal">0</b></div>
        <div class="stat-box">Bílkoviny<b id="total-prot">0</b></div>
        <div class="stat-box">Sacharidy<b id="total-carb">0</b></div>
    </div>

    <div id="form-area" class="form-card">
        <div class="autocomplete-wrapper">
            <input type="text" id="f-name" placeholder="Název jídla (např. Rohlík)" autocomplete="off">
            <div id="suggestions"></div>
        </div>

        <div class="photo-area" onclick="document.getElementById('f-file').click()">
            <span id="f-photo-label">📸 Přidat fotku</span>
            <img id="f-preview" style="display:none">
        </div>
        <input type="file" id="f-file" accept="image/*" capture="environment" style="display:none" onchange="previewPhoto(this)">

        <div style="display: flex; gap: 5px;">
            <input type="number" id="f-weight" value="100" placeholder="Gramy">
            <select id="f-type">
                <option value="snidane">Snídaně</option>
                <option value="dop-svacina">Svačina</option>
                <option value="obed">Oběd</option>
                <option value="veceře">Večeře</option>
            </select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;">
            <input type="number" id="f-kcal" placeholder="kcal/100g">
            <input type="number" id="f-prot" placeholder="bílk/100g">
            <input type="number" id="f-carb" placeholder="sach/100g">
        </div>
        <button onclick="saveFood()" style="width:100%; padding:15px; background:var(--success); color:white; border:none; border-radius:8px; margin-top:10px; font-weight:bold;">ULOŽIT</button>
        <button onclick="closeForm()" style="width:100%; background:none; border:none; color:gray; margin-top:10px;">Zrušit</button>
    </div>

    <div id="meals-list"></div>
</div>

<button class="fab" onclick="openForm()">+</button>

<script>
    // Pevná databáze pro začátek
    const BASE_DB = [
        { n: "Rohlík bílý", k: 310, p: 9, c: 60 },
        { n: "Chléb Šumava", k: 245, p: 8, c: 48 },
        { n: "Banán", k: 89, p: 1.1, c: 23 },
        { n: "Vejce vařené", k: 155, p: 13, c: 1 }
    ];

    // Data z paměti
    let weeklyLog = JSON.parse(localStorage.getItem('fitWeeklyLog')) || [[],[],[],[],[],[],[]];
    let customDB = JSON.parse(localStorage.getItem('fitCustomDB')) || [];
    let currentDay = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;
    let tempPhoto = "";

    function changeDay(idx) { currentDay = idx; updateUI(); }
    function openForm() { document.getElementById('form-area').style.display = 'block'; resetForm(); }
    function closeForm() { document.getElementById('form-area').style.display = 'none'; }
    
    function resetForm() {
        document.getElementById('f-name').value = "";
        document.getElementById('f-kcal').value = "";
        document.getElementById('f-prot').value = "";
        document.getElementById('f-carb').value = "";
        document.getElementById('f-preview').style.display = "none";
        document.getElementById('f-photo-label').style.display = "block";
        tempPhoto = "";
    }

    function previewPhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                tempPhoto = e.target.result;
                document.getElementById('f-preview').src = tempPhoto;
                document.getElementById('f-preview').style.display = "block";
                document.getElementById('f-photo-label').style.display = "none";
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // Vyhledávání v databázi
    document.getElementById('f-name').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        const sug = document.getElementById('suggestions');
        sug.innerHTML = '';
        if (val.length < 1) { sug.style.display = 'none'; return; }

        const allFoods = [...customDB, ...BASE_DB.map(x => ({...x, i:""}))];
        const matches = allFoods.filter(x => x.n.toLowerCase().includes(val));

        matches.forEach(x => {
            const d = document.createElement('div');
            d.className = 'suggestion-item';
            const imgHtml = x.i ? `<img src="${x.i}">` : `<div style="width:35px;height:35px;background:#eee;border-radius:4px"></div>`;
            d.innerHTML = `${imgHtml} <span>${x.n} (${x.k} kcal)</span>`;
            d.onclick = () => {
                document.getElementById('f-name').value = x.n;
                document.getElementById('f-kcal').value = x.k;
                document.getElementById('f-prot').value = x.p;
                document.getElementById('f-carb').value = x.c;
                if(x.i) {
                    tempPhoto = x.i;
                    document.getElementById('f-preview').src = x.i;
                    document.getElementById('f-preview').style.display = "block";
                    document.getElementById('f-photo-label').style.display = "none";
                }
                sug.style.display = 'none';
            };
            sug.appendChild(d);
        });
        sug.style.display = matches.length ? 'block' : 'none';
    });

    function saveFood() {
        const name = document.getElementById('f-name').value;
        const kcal = Number(document.getElementById('f-kcal').value);
        const prot = Number(document.getElementById('f-prot').value);
        const carb = Number(document.getElementById('f-carb').value);
        const weight = Number(document.getElementById('f-weight').value);
        const type = document.getElementById('f-type').value;

        if (!name) return;

        // Přidání do vlastní databáze (pokud je nové)
        if (!customDB.some(x => x.n.toLowerCase() === name.toLowerCase())) {
            customDB.push({ n: name, k: kcal, p: prot, c: carb, i: tempPhoto });
            localStorage.setItem('fitCustomDB', JSON.stringify(customDB));
        }

        // Zápis do deníku
        const r = weight / 100;
        weeklyLog[currentDay].push({
            id: Date.now(), n: name, k: Math.round(kcal * r), p: (prot * r).toFixed(1), c: (carb * r).toFixed(1),
            img: tempPhoto, type: type
        });

        localStorage.setItem('fitWeeklyLog', JSON.stringify(weeklyLog));
        updateUI();
        closeForm();
    }

    function deleteItem(id) {
        weeklyLog[currentDay] = weeklyLog[currentDay].filter(x => x.id !== id);
        localStorage.setItem('fitWeeklyLog', JSON.stringify(weeklyLog));
        updateUI();
    }

    function updateUI() {
        // Označení dne
        document.querySelectorAll('.day-tab').forEach((t, i) => t.className = i === currentDay ? 'day-tab active' : 'day-tab');
        
        const list = document.getElementById('meals-list');
        list.innerHTML = '';
        let sK = 0, sP = 0, sC = 0;

        ['snidane', 'dop-svacina', 'obed', 'veceře'].forEach(mealType => {
            const items = weeklyLog[currentDay].filter(x => x.type === mealType);
            if (items.length === 0 && mealType !== 'snidane') return; // Snídani necháme vidět vždy

            let mK = 0; items.forEach(i => mK += i.k);
            let html = `<div class="meal-section"><div class="meal-header">${mealType.toUpperCase()} <span>${mK} kcal</span></div>`;
            
            items.forEach(i => {
                sK += i.k; sP += Number(i.p); sC += Number(i.c);
                const imgTag = i.img ? `<img src="${i.img}">` : `<div style="width:45px;height:45px;background:#eee;border-radius:8px"></div>`;
                html += `<div class="log-item">${imgTag}<div><b>${i.n}</b><br><small>B: ${i.p}g | S: ${i.c}g | ${i.k} kcal</small></div><button class="del-btn" onclick="deleteItem(${i.id})">🗑️</button></div>`;
            });
            list.innerHTML += html + '</div>';
        });

        document.getElementById('total-kcal').innerText = sK;
        document.getElementById('total-prot').innerText = sP.toFixed(1);
        document.getElementById('total-carb').innerText = sC.toFixed(1);
    }
    updateUI();
</script>
</body>
</html>
