<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitKuchařka (Vylepšená)</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #3498db; --danger: #e74c3c; --bg: #f8f9fa; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; padding-bottom: 80px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); font-size: 1.4rem; }
        
        .stats { display: flex; justify-content: space-around; background: #e3f2fd; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .stat-box { text-align: center; }
        .stat-box span { display: block; font-size: 1.2rem; font-weight: bold; color: var(--primary); }

        /* Skryté okno skeneru */
        #scanner-wrapper { 
            display: none; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; flex-direction: column;
        }
        #reader { width: 90%; max-width: 400px; background: white; border-radius: 15px; overflow: hidden; }
        
        /* Plovoucí tlačítko */
        .scan-btn { 
            position: fixed; bottom: 20px; right: 20px; 
            width: 65px; height: 65px; background: var(--primary); 
            border-radius: 50%; border: none; color: white; font-size: 28px; 
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4); cursor: pointer; z-index: 999;
            display: flex; justify-content: center; align-items: center;
        }

        .result-card { background: #fff; border: 2px solid var(--primary); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        input { width: 80px; padding: 10px; border-radius: 8px; border: 1px solid #ddd; text-align: center; font-size: 1rem; }
        
        /* Styl seznamu jídel */
        .log-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .log-info { display: flex; flex-direction: column; }
        .log-name { font-weight: bold; font-size: 0.95rem; }
        .log-meta { font-size: 0.8rem; color: #7f8c8d; }
        .delete-btn { background: none; border: none; color: var(--danger); font-size: 1.2rem; cursor: pointer; padding: 5px 10px; }
        
        .close-btn { color: white; margin-top: 20px; background: none; border: 1px solid white; padding: 8px 20px; border-radius: 8px; cursor: pointer; }
        .add-confirm-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; margin-left: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍎 FitKuchařka</h1>

    <div class="stats">
        <div class="stat-box">Dnes<span><span id="total-kcal">0</span> kcal</span></div>
        <div class="stat-box">Bílkoviny<span><span id="total-protein">0</span> g</span></div>
    </div>

    <div id="result-area" style="display: none;">
        <div class="result-card">
            <h3 id="food-name" style="margin-top:0">Název produktu</h3>
            <p id="food-info" style="color: #666; font-size: 0.9rem;"></p>
            <div style="margin-top: 10px;">
                <input type="number" id="food-weight" value="100"> g
                <button class="add-confirm-btn" onclick="addFood()">PŘIDAT</button>
            </div>
        </div>
    </div>

    <h3>Dnešní záznamy:</h3>
    <div id="food-list"></div>
</div>

<div id="scanner-wrapper">
    <div id="reader"></div>
    <button class="close-btn" onclick="stopScanner()">Zavřít</button>
</div>

<button class="scan-btn" onclick="startScanner()">📷</button>

<script>
    let dailyLog = JSON.parse(localStorage.getItem('dailyLog')) || [];
    let currentFood = null;
    let html5QrCode;

    async function startScanner() {
        document.getElementById('scanner-wrapper').style.display = 'flex';
        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 180 } };
        
        try {
            await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
        } catch (err) {
            alert("Kamera se nespustila. Povolte přístup.");
            stopScanner();
        }
    }

    async function stopScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            await html5QrCode.stop();
        }
        document.getElementById('scanner-wrapper').style.display = 'none';
    }

    async function onScanSuccess(barcode) {
        await stopScanner();
        
        try {
            const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
            const data = await response.json();

            if (data.status === 1) {
                const p = data.product;
                const name = p.product_name_cs || p.product_name || "Neznámý produkt";
                const brand = p.brands ? p.brands.split(',')[0] : "";
                
                currentFood = {
                    name: brand ? `${brand} ${name}` : name,
                    kcal: p.nutriments['energy-kcal_100g'] || 0,
                    protein: p.nutriments.proteins_100g || 0
                };

                document.getElementById('food-name').innerText = currentFood.name;
                document.getElementById('food-info').innerText = `${Math.round(currentFood.kcal)} kcal na 100g`;
                document.getElementById('result-area').style.display = 'block';
                // Posunout zobrazení na výsledek
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert("Produkt nenalezen v databázi.");
            }
        } catch (err) {
            alert("Chyba při komunikaci s databází.");
        }
    }

    function addFood() {
        const weight = document.getElementById('food-weight').value;
        if (!weight || weight <= 0) return;

        const entry = {
            id: Date.now(), // Unikátní ID pro mazání
            name: currentFood.name,
            finalKcal: Math.round(currentFood.kcal * (weight / 100)),
            finalProtein: Math.round(currentFood.protein * (weight / 100)),
            weight: weight
        };

        dailyLog.unshift(entry);
        saveAndUpdate();
        document.getElementById('result-area').style.display = 'none';
    }

    function deleteFood(id) {
        if(confirm("Opravdu smazat tento záznam?")) {
            dailyLog = dailyLog.filter(item => item.id !== id);
            saveAndUpdate();
        }
    }

    function saveAndUpdate() {
        localStorage.setItem('dailyLog', JSON.stringify(dailyLog));
        updateUI();
    }

    function updateUI() {
        const listDiv = document.getElementById('food-list');
        listDiv.innerHTML = '';
        let tk = 0, tp = 0;

        dailyLog.forEach(item => {
            tk += item.finalKcal; 
            tp += item.finalProtein;
            
            listDiv.innerHTML += `
                <div class="log-item">
                    <div class="log-info">
                        <span class="log-name">${item.name}</span>
                        <span class="log-meta">${item.weight}g | ${item.finalKcal} kcal | ${item.finalProtein}g B</span>
                    </div>
                    <button class="delete-btn" onclick="deleteFood(${item.id})">🗑️</button>
                </div>`;
        });

        document.getElementById('total-kcal').innerText = tk;
        document.getElementById('total-protein').innerText = tp;
    }

    updateUI();
</script>

</body>
</html>
