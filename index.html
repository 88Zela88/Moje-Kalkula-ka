<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitKuchařka (Community Edition)</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #e67e22; --bg: #fdf6f0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); }
        .stats { display: flex; justify-content: space-around; background: #fff3e0; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .stat-box { text-align: center; }
        .stat-box span { display: block; font-size: 1.2rem; font-weight: bold; color: var(--primary); }
        #reader { width: 100%; border-radius: 15px; overflow: hidden; margin-bottom: 20px; border: 2px solid #eee; }
        .result-card { background: #fff; border: 2px solid var(--primary); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        input { width: 80px; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; }
        button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .log-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .status-msg { font-size: 0.8rem; color: #888; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍊 FitKuchařka Zdarma</h1>

    <div class="stats">
        <div class="stat-box">Kcal<span id="total-kcal">0</span></div>
        <div class="stat-box">Bílkoviny<span id="total-protein">0</span>g</div>
    </div>

    <div id="status" class="status-msg">Namiřte kameru na čárový kód</div>
    <div id="reader"></div>

    <div id="result-area" style="display: none;">
        <div class="result-card">
            <h3 id="food-name" style="margin-top: 0;">Název</h3>
            <p id="food-info" style="color: #666;"></p>
            <div style="margin: 15px 0;">
                <label>Snědeno: </label>
                <input type="number" id="food-weight" value="100"> g
            </div>
            <button onclick="addFood()">PŘIDAT DO DENÍKU</button>
        </div>
    </div>

    <h3>Dnešní záznamy:</h3>
    <div id="food-list"></div>
</div>

<script>
    let dailyLog = JSON.parse(localStorage.getItem('dailyLog')) || [];
    let currentFood = null;

    // Inicializace skeneru
    const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 150} });
    scanner.render(onScan);

    async function onScan(barcode) {
        document.getElementById('status').innerText = "Hledám kód: " + barcode;
        
        try {
            // Používáme v0 API, které je nejstabilnější pro české produkty
            const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
            const data = await response.json();

            if (data.status === 1) {
                const p = data.product;
                
                // --- LOGIKA PRO ČIŠTĚNÍ NÁZVU ---
                // 1. Zkusíme český název, pak značku + název, pak mezinárodní název
                let rawName = p.product_name_cs || p.product_name || p.generic_name_cs || "Neznámý produkt";
                let brand = p.brands ? p.brands.split(',')[0] : "";
                
                // Pokud název neobsahuje značku, přidáme ji (např. "Opavia BeBe")
                let finalName = rawName;
                if (brand && !rawName.toLowerCase().includes(brand.toLowerCase())) {
                    finalName = brand + " " + rawName;
                }

                currentFood = {
                    name: finalName,
                    kcal: p.nutriments['energy-kcal_100g'] || p.nutriments['energy-kcal'] || 0,
                    protein: p.nutriments.proteins_100g || 0
                };

                // Zastavíme skener, aby uživatel mohl v klidu zadat váhu
                document.getElementById('food-name').innerText = currentFood.name;
                document.getElementById('food-info').innerText = `${Math.round(currentFood.kcal)} kcal na 100g`;
                document.getElementById('result-area').style.display = 'block';
                document.getElementById('status').innerText = "Produkt nalezen!";
            } else {
                document.getElementById('status').innerText = "V databázi OFF nenalezeno.";
            }
        } catch (err) {
            document.getElementById('status').innerText = "Chyba sítě. Zkuste to znovu.";
        }
    }

    function addFood() {
        const weight = document.getElementById('food-weight').value;
        const ratio = weight / 100;
        
        const entry = {
            name: currentFood.name,
            finalKcal: Math.round(currentFood.kcal * ratio),
            finalProtein: Math.round(currentFood.protein * ratio),
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        };

        dailyLog.unshift(entry); // Přidá na začátek seznamu
        localStorage.setItem('dailyLog', JSON.stringify(dailyLog));
        updateUI();
        document.getElementById('result-area').style.display = 'none';
        document.getElementById('status').innerText = "Přidáno. Můžete skenovat další.";
    }

    function updateUI() {
        const listDiv = document.getElementById('food-list');
        listDiv.innerHTML = '';
        let tk = 0, tp = 0;

        dailyLog.forEach(item => {
            tk += item.finalKcal; tp += item.finalProtein;
            listDiv.innerHTML += `
                <div class="log-item">
                    <span>${item.time} <b>${item.name}</b></span>
                    <span>${item.finalKcal} kcal</span>
                </div>`;
        });

        document.getElementById('total-kcal').innerText = tk;
        document.getElementById('total-protein').innerText = tp;
    }

    updateUI();
</script>

</body>
</html>
