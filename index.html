<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitKuchařka - Komunitní Databáze</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #3498db; --success: #2ecc71; --danger: #e74c3c; --bg: #f4f7f6; --text: #2c3e50; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; padding-bottom: 90px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #e3f2fd; padding: 12px; border-radius: 15px; margin-bottom: 15px; }
        .stat-box { text-align: center; font-size: 0.75rem; }
        .stat-box b { display: block; font-size: 1rem; color: var(--primary); }

        /* Hledání */
        .autocomplete-wrapper { position: relative; }
        #suggestions { 
            position: absolute; top: 100%; left: 0; right: 0; 
            background: white; border: 1px solid #ddd; border-radius: 0 0 10px 10px; 
            max-height: 300px; overflow-y: auto; z-index: 1001; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: none;
        }
        .suggestion-item { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .suggestion-item img { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; background: #eee; }
        .tag { font-size: 0.6rem; padding: 2px 5px; border-radius: 4px; margin-left: auto; }
        .tag-custom { background: #e8f5e9; color: #2e7d32; }

        /* Formular */
        .form-card { background: white; border: 2px solid var(--primary); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; margin-top: 8px; font-size: 1rem; }
        .photo-preview { width: 100%; height: 150px; background: #eee; border-radius: 8px; margin-top: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px dashed #ccc; }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; }

        .floating-btns { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; }
        .fab { width: 60px; height: 60px; border-radius: 50%; border: none; color: white; font-size: 24px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .meal-section { margin-top: 15px; border: 1px solid #eee; border-radius: 12px; overflow: hidden; }
        .meal-header { background: #f8f9fa; padding: 10px; font-weight: bold; display: flex; justify-content: space-between; }
        .log-item { padding: 10px; border-bottom: 1px solid #f9f9f9; position: relative; display: flex; gap: 10px; align-items: center; }
        .log-item img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
        .del { margin-left: auto; background: none; border: none; color: var(--danger); font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍎 FitKuchařka PRO</h1>

    <div class="stats-grid">
        <div class="stat-box">Kcal<b id="total-kcal">0</b></div>
        <div class="stat-box">Bílkoviny<b id="total-prot">0</b></div>
        <div class="stat-box">Sacharidy<b id="total-carb">0</b></div>
    </div>

    <div id="manual-form-area" style="display: none;" class="form-card">
        <h3 style="margin:0">Nová potravina</h3>
        <div class="autocomplete-wrapper">
            <input type="text" id="m-name" placeholder="Název potraviny..." autocomplete="off">
            <div id="suggestions"></div>
        </div>
        
        <div class="photo-preview" onclick="document.getElementById('m-photo').click()">
            <span id="photo-label">📸 Přidat fotku</span>
            <img id="img-preview" src="" style="display:none">
        </div>
        <input type="file" id="m-photo" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
            <input type="number" id="m-weight" value="100" placeholder="Gramy">
            <select id="m-meal-type">
                <option value="snidane">Snídaně</option><option value="obed">Oběd</option><option value="veceře">Večeře</option><option value="svacina">Svačina</option>
            </select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;">
            <input type="number" id="m-kcal" placeholder="kcal/100g">
            <input type="number" id="m-prot" placeholder="bílk/100g">
            <input type="number" id="m-carb" placeholder="sach/100g">
        </div>
        <button onclick="saveAndAdd()" style="width:100%; padding:15px; background:var(--success); color:white; border:none; border-radius:8px; margin-top:10px; font-weight:bold;">ULOŽIT DO MOJÍ DATABÁZE</button>
        <button onclick="document.getElementById('manual-form-area').style.display='none'" style="background:none; border:none; color:#999; width:100%; margin-top:10px;">Zrušit</button>
    </div>

    <div id="meals-container"></div>
</div>

<div class="floating-btns">
    <button class="fab" style="background:var(--success)" onclick="openForm()">✍️</button>
</div>

<script>
    // Základní "systémová" data
    const SYSTEM_DB = [
        { n: "Rohlík bílý", k: 310, p: 9, c: 60, i: "" },
        { n: "Banán", k: 89, p: 1.1, c: 23, i: "" }
    ];

    // Načtení uživatelské databáze a denního logu
    let customDB = JSON.parse(localStorage.getItem('myCustomDB')) || [];
    let dailyLog = JSON.parse(localStorage.getItem('dailyLog')) || [];
    let currentPhotoBase64 = "";

    function openForm() {
        document.getElementById('manual-form-area').style.display = 'block';
        resetForm();
    }

    function resetForm() {
        document.getElementById('m-name').value = "";
        document.getElementById('m-kcal').value = "";
        document.getElementById('m-prot').value = "";
        document.getElementById('m-carb').value = "";
        document.getElementById('img-preview').style.display = "none";
        document.getElementById('photo-label').style.display = "block";
        currentPhotoBase64 = "";
    }

    // Zpracování fotografie
    function handlePhoto(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onloadend = function() {
            currentPhotoBase64 = reader.result;
            document.getElementById('img-preview').src = currentPhotoBase64;
            document.getElementById('img-preview').style.display = "block";
            document.getElementById('photo-label').style.display = "none";
        }
        if (file) reader.readAsDataURL(file);
    }

    // Našeptávač (hledá v obou DB)
    const inp = document.getElementById('m-name');
    const sug = document.getElementById('suggestions');

    inp.addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        sug.innerHTML = '';
        if (val.length < 1) { sug.style.display = 'none'; return; }

        const allFoods = [...customDB.map(f => ({...f, custom: true})), ...SYSTEM_DB];
        const matches = allFoods.filter(x => x.n.toLowerCase().includes(val));

        matches.forEach(x => {
            const d = document.createElement('div');
            d.className = 'suggestion-item';
            const imgHtml = x.i ? `<img src="${x.i}">` : `<div style="width:40px;height:40px;background:#eee;border-radius:5px"></div>`;
            d.innerHTML = `${imgHtml} <div><b>${x.n}</b><br><small>${x.k} kcal</small></div> ${x.custom ? '<span class="tag tag-custom">Moje</span>' : ''}`;
            d.onclick = () => {
                inp.value = x.n;
                document.getElementById('m-kcal').value = x.k;
                document.getElementById('m-prot').value = x.p;
                document.getElementById('m-carb').value = x.c;
                if(x.i) {
                    currentPhotoBase64 = x.i;
                    document.getElementById('img-preview').src = x.i;
                    document.getElementById('img-preview').style.display = "block";
                    document.getElementById('photo-label').style.display = "none";
                }
                sug.style.display = 'none';
            };
            sug.appendChild(d);
        });
        sug.style.display = matches.length ? 'block' : 'none';
    });

    // Uložit do DB a zároveň do denního logu
    function saveAndAdd() {
        const name = inp.value;
        const kcal = Number(document.getElementById('m-kcal').value);
        const prot = Number(document.getElementById('m-prot').value);
        const carb = Number(document.getElementById('m-carb').value);
        const weight = Number(document.getElementById('m-weight').value);

        // 1. Pokud potravina ještě není v customDB, ulož ji tam
        if (!customDB.find(x => x.n === name)) {
            customDB.push({ n: name, k: kcal, p: prot, c: carb, i: currentPhotoBase64 });
            localStorage.setItem('myCustomDB', JSON.stringify(customDB));
        }

        // 2. Přidej do denního logu
        const ratio = weight / 100;
        dailyLog.push({
            id: Date.now(),
            n: name,
            k: Math.round(kcal * ratio),
            p: (prot * ratio).toFixed(1),
            c: (carb * ratio).toFixed(1),
            i: currentPhotoBase64,
            t: document.getElementById('m-meal-type').value
        });
        localStorage.setItem('dailyLog', JSON.stringify(dailyLog));
        
        updateUI();
        document.getElementById('manual-form-area').style.display = 'none';
    }

    function deleteItem(id) {
        dailyLog = dailyLog.filter(x => x.id !== id);
        localStorage.setItem('dailyLog', JSON.stringify(dailyLog));
        updateUI();
    }

    function updateUI() {
        const cont = document.getElementById('meals-container');
        cont.innerHTML = '';
        let sK = 0, sP = 0, sC = 0;

        ['snidane', 'svacina', 'obed', 'veceře'].forEach(mealType => {
            const items = dailyLog.filter(x => x.t === mealType);
            if (items.length === 0) return;
            
            let mK = 0; items.forEach(i => mK += i.k);
            let html = `<div class="meal-section"><div class="meal-header">${mealType.toUpperCase()} <span>${mK} kcal</span></div>`;
            
            items.forEach(i => {
                sK += i.k; sP += Number(i.p); sC += Number(i.c);
                const imgTag = i.i ? `<img src="${i.i}">` : `<div style="width:45px;height:45px;background:#eee;border-radius:8px"></div>`;
                html += `
                    <div class="log-item">
                        ${imgTag}
                        <div><b>${i.n}</b><br><small>B: ${i.p}g | S: ${i.c}g — ${i.k} kcal</small></div>
                        <button class="del" onclick="deleteItem(${i.id})">🗑️</button>
                    </div>`;
            });
            cont.innerHTML += html + '</div>';
        });

        document.getElementById('total-kcal').innerText = sK;
        document.getElementById('total-prot').innerText = sP.toFixed(1);
        document.getElementById('total-carb').innerText = sC.toFixed(1);
    }

    updateUI();
</script>
</body>
</html>
