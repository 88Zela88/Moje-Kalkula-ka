<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitKuchařka PRO</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #2ecc71; --bg: #f0f2f5; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); font-size: 1.5rem; }
        
        .stats { display: flex; justify-content: space-around; background: #e8f5e9; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .stat-box { text-align: center; }
        .stat-box span { display: block; font-size: 1.2rem; font-weight: bold; color: var(--primary); }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer; background: #ddd; font-weight: bold; }
        .tab.active { background: var(--primary); color: white; }

        #reader { width: 100%; border-radius: 15px; overflow: hidden; margin-bottom: 20px; border: 2px dashed #ccc; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        button.main-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 10px; }
        
        .food-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .food-item:last-child { border-bottom: none; }
        .delete-btn { color: #ff7675; font-size: 0.8rem; cursor: pointer; border: 1px solid #ff7675; padding: 2px 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍎 Moje FitKuchařka</h1>

    <div class="stats">
        <div class="stat-box">Dnes<span id="total-kcal">0</span>kcal</div>
        <div class="stat-box">Bílkoviny<span id="total-protein">0</span>g</div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('scan')">Skener</button>
        <button class="tab" onclick="switchTab('manual')">Vlastní recept</button>
    </div>

    <div id="scan-section">
        <div id="reader"></div>
        <div id="result-area" style="display: none; background: #fffde7; padding: 15px; border-radius: 12px; border: 1px solid #fff59d;">
            <h4 id="food-name" style="margin: 0 0 10px 0;">Název</h4>
            <div class="form-group">
                <label>Snědené množství (g)</label>
                <input type="number" id="food-weight" value="100">
            </div>
            <button class="main-btn" onclick="addFoodToList('scan')">Přidat do deníku</button>
        </div>
    </div>

    <div id="manual-section" style="display: none;">
        <div class="form-group">
            <label>Název jídla / receptu</label>
            <input type="text" id="manual-name" placeholder="Např. Domácí rizoto">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
                <label>Kalorie (kcal)</label>
                <input type="number" id="manual-kcal" placeholder="0">
            </div>
            <div class="form-group">
                <label>Bílkoviny (g)</label>
                <input type="number" id="manual-protein" placeholder="0">
            </div>
        </div>
        <button class="main-btn" onclick="addFoodToList('manual')">Uložit jídlo</button>
    </div>

    <h3 style="margin-top: 25px;">Dnešní jídla:</h3>
    <div id="food-list"></div>
    <button onclick="clearLog()" style="background: none; border: none; color: #999; font-size: 0.8rem; cursor: pointer; width: 100%; margin-top: 20px;">Smazat celý den</button>
</div>

<script>
    let dailyLog = JSON.parse(localStorage.getItem('dailyLog')) || [];
    let scannedFood = null;

    // Přepínání tabů
    function switchTab(type) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('scan-section').style.display = type === 'scan' ? 'block' : 'none';
        document.getElementById('manual-section').style.display = type === 'manual' ? 'block' : 'none';
    }

    // Skener
    const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    scanner.render((code) => {
        fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`)
            .then(res => res.json())
            .then(data => {
                if(data.status === 1) {
                    const p = data.product;
                    scannedFood = {
                        name: p.product_name || "Neznámý produkt",
                        kcal: p.nutriments['energy-kcal_100g'] || 0,
                        protein: p.nutriments.proteins_100g || 0
                    };
                    document.getElementById('food-name').innerText = scannedFood.name;
                    document.getElementById('result-area').style.display = 'block';
                }
            });
    });

    function addFoodToList(mode) {
        let entry;
        if(mode === 'scan') {
            const weight = document.getElementById('food-weight').value;
            entry = {
                name: scannedFood.name,
                finalKcal: Math.round(scannedFood.kcal * (weight / 100)),
                finalProtein: Math.round(scannedFood.protein * (weight / 100))
            };
            document.getElementById('result-area').style.display = 'none';
        } else {
            entry = {
                name: document.getElementById('manual-name').value || "Vlastní jídlo",
                finalKcal: parseInt(document.getElementById('manual-kcal').value) || 0,
                finalProtein: parseInt(document.getElementById('manual-protein').value) || 0
            };
            // Vyčistit formulář
            document.getElementById('manual-name').value = '';
            document.getElementById('manual-kcal').value = '';
            document.getElementById('manual-protein').value = '';
        }

        dailyLog.push(entry);
        localStorage.setItem('dailyLog', JSON.stringify(dailyLog));
        updateUI();
    }

    function updateUI() {
        const listDiv = document.getElementById('food-list');
        listDiv.innerHTML = '';
        let tKcal = 0, tProt = 0;

        dailyLog.forEach((item, index) => {
            tKcal += item.finalKcal;
            tProt += item.finalProtein;
            listDiv.innerHTML += `
                <div class="food-item">
                    <div>
                        <strong>${item.name}</strong><br>
                        <small>${item.finalKcal} kcal | ${item.finalProtein}g bílk.</small>
                    </div>
                    <span class="delete-btn" onclick="removeItem(${index})">Odstranit</span>
                </div>`;
        });

        document.getElementById('total-kcal').innerText = tKcal;
        document.getElementById('total-protein').innerText = tProt;
    }

    function removeItem(index) {
        dailyLog.splice(index, 1);
        localStorage.setItem('dailyLog', JSON.stringify(dailyLog));
        updateUI();
    }

    function clearLog() {
        if(confirm("Opravdu smazat celý den?")) {
            dailyLog = [];
            localStorage.removeItem('dailyLog');
            updateUI();
        }
    }

    updateUI();
</script>

</body>
</html>
